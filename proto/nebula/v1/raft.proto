syntax = "proto3";

package nebula.v1;

option go_package = "github.com/coolstack-coder/nebulaos/gen/nebula/v1;nebulav1";

// Raft is the peer-to-peer consensus protocol spoken between control-plane
// members. Message shapes follow Figure 2 of the Raft paper (Ongaro &
// Ousterhout, 2014) plus the conflict hints from section 5.3 that let a
// leader back up a follower's log in one round trip per term instead of one
// per entry.
service Raft {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendRequest) returns (AppendResponse);
  rpc InstallSnapshot(SnapshotRequest) returns (SnapshotResponse);
}

enum EntryType {
  ENTRY_COMMAND = 0;
  // Written by every new leader so it can commit entries from earlier terms
  // (Raft section 5.4.2 / 8).
  ENTRY_NOOP = 1;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  EntryType type = 3;
  bytes data = 4;
}

message VoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // Pre-vote (Raft thesis 9.6): ask whether we *would* win before bumping our
  // term, so a partitioned node rejoining can't disrupt a healthy leader.
  bool pre_vote = 5;
}

message VoteResponse {
  uint64 term = 1;
  bool granted = 2;
}

message AppendRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendResponse {
  uint64 term = 1;
  bool success = 2;
  // On rejection: the first index of the conflicting term (or the follower's
  // log length if it is simply too short).
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
  uint64 last_index = 5;
}

message SnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message SnapshotResponse {
  uint64 term = 1;
}
